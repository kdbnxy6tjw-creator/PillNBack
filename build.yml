name: Build PillNBack deb
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 打包工具
        run: brew install dpkg ldid || true
      - name: 校验 SDK
        run: xcrun --sdk iphoneos --show-sdk-path
      - name: 拉 roothide Theos
        run: git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
      - name: 编译
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: PillNBack-deb
          path: packages/*.deb
          if-no-files-found: error
